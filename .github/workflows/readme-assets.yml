name: Readme assets

# Keeps the README's binary-size line and screenshots current on every PR:
# builds the showcase example in release on Windows and macOS, measures the
# binary, screenshots it running, and commits the results back to the PR
# branch. Fork PRs can't be pushed to, so they get the generated files as an
# artifact plus a note in the job summary instead.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  EXAMPLE: simples

permissions:
  contents: write

jobs:
  assets:
    name: ${{ matrix.label }} assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build example (release)
        run: cargo build --release --example ${{ env.EXAMPLE }}

      - name: Measure binary size
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          wc -c < "target/release/examples/$EXAMPLE$ext" | tr -d '[:space:]' > dist/size.txt
          echo "$EXAMPLE$ext: $(cat dist/size.txt) bytes"

      - name: Screenshot example (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/capture-screenshot.ps1 -Exe "target/release/examples/${env:EXAMPLE}.exe" -Out "dist/screenshot.png"

      - name: Screenshot example (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/capture-screenshot.sh "target/release/examples/$EXAMPLE" dist/screenshot.png

      - uses: actions/upload-artifact@v7
        with:
          name: readme-asset-${{ matrix.label }}
          path: dist/
          if-no-files-found: error

  update-readme:
    name: Update README
    needs: assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/download-artifact@v7
        with:
          pattern: readme-asset-*
          path: dist

      - name: Rewrite README and screenshots
        run: |
          node scripts/update_readme.mjs \
            --example "$EXAMPLE" \
            --windows-bytes "$(tr -d '[:space:]' < dist/readme-asset-windows/size.txt)" \
            --mac-bytes "$(tr -d '[:space:]' < dist/readme-asset-macos/size.txt)"
          mkdir -p docs/screenshots
          cp dist/readme-asset-windows/screenshot.png "docs/screenshots/$EXAMPLE-windows.png"
          cp dist/readme-asset-macos/screenshot.png "docs/screenshots/$EXAMPLE-macos.png"

      - name: Commit and push
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain -- README.md docs/screenshots)" ]; then
            echo "README assets already up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots
          git commit -m "docs: refresh $EXAMPLE size and screenshots"
          git push

      - name: Note fork PR fallback
        if: github.event_name != 'workflow_dispatch' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "### Fork PR - cannot push to \`${{ github.event.pull_request.head.repo.full_name }}\`"
            echo "The generated README and screenshots are attached as the \`readme-assets\` artifact."
            echo "A maintainer can commit them, or rerun this workflow via workflow_dispatch from a branch in this repo."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated files (fork PRs)
        if: github.event_name != 'workflow_dispatch' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: readme-assets
          path: |
            README.md
            docs/screenshots/
