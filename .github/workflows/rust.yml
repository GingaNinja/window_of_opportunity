name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Check win32
        run: cargo check --verbose --target x86_64-pc-windows-gnu
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
