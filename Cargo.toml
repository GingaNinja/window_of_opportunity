[package]
name = "window_of_opportunity"
version = "0.6.0"
edition = "2024"
authors = ["Dave Arkell dave@arkells.net"]
description = "window_of_opportunity is attempting to make a native react style library"
license = "MIT OR Apache-2.0"
categories = ["gui"]
repository = "https://github.com/GingaNinja/window_of_opportunity"

[target.'cfg(target_os = "macos")'.dependencies]
cacao = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Direct2D",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# The survey tests drive a real app through the shell's messages and read
# it back the way Narrator does (UIA), so they need the accessibility,
# COM, and IME surfaces the library itself doesn't.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[build-dependencies]
embed-resource = "3.0.12"


[features]
default = ["image-png", "image-jpeg"]
debug_dump = []

# Image decode formats — forwarded to the `image` crate so every app pays
# only for what it loads:
#   window_of_opportunity = { default-features = false, features = ["image-webp"] }
# `image-formats` turns on everything the image crate supports (its own
# default-formats set). See also `image-rayon` for parallel decode.
image-formats = ["image/default-formats"]
image-png = ["image/png"]
image-jpeg = ["image/jpeg"]
image-gif = ["image/gif"]
image-bmp = ["image/bmp"]
image-ico = ["image/ico"]
image-tiff = ["image/tiff"]
image-webp = ["image/webp"]
image-tga = ["image/tga"]
image-hdr = ["image/hdr"]
image-dds = ["image/dds"]
image-pnm = ["image/pnm"]
image-qoi = ["image/qoi"]
image-farbfeld = ["image/ff"]
image-exr = ["image/exr"]
image-avif = ["image/avif"]
image-rayon = ["image/rayon"]

[dependencies]
image = { version = "0.25.10", default-features = false }
