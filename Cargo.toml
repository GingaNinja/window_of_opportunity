[package]
name = "window_of_opportunity"
version = "0.3.2"
edition = "2024"
authors = ["Dave Arkell dave@arkells.net"]
description = "window_of_opportunity is attempting to make a native react style library"
license = "MIT OR Apache-2.0"
categories = ["GUI"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[target.'cfg(target_os = "macos")'.dependencies]
cacao = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56.0", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"]}

[features]
debug_dump = []
