[package]
name = "window_of_opportunity"
version = "0.5.2"
edition = "2024"
authors = ["Dave Arkell dave@arkells.net"]
description = "window_of_opportunity is attempting to make a native react style library"
license = "MIT OR Apache-2.0"
categories = ["gui"]
repository = "https://github.com/GingaNinja/window_of_opportunity"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[target.'cfg(target_os = "macos")'.dependencies]
cacao = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# The survey tests drive a real app through the shell's messages and read
# it back the way Narrator does (UIA), so they need the accessibility,
# COM, and IME surfaces the library itself doesn't.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_Ime",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[features]
debug_dump = []
